---
- name: "Set dynamic vars"
  set_fact:
    tmp_file: '{{ "exec_" + query("community.general.random_string", length=12, upper=true, numbers=true, special=false)[0] | string + ".txt" }}'
    esxi_login: &esxi_login
      - hostname: '{{ vcenter_address }}'
      - username: '{{ vcenter_login }}'
      - password: '{{ vcenter_password }}'   
      - datacenter: '{{ vcenter_datacenter }}'
      - validate_certs: no  

- debug: msg="vSphere IP {{ vcenter_address }}"

- name: Add vSphere
  add_host:
    name: '{{ vcenter_address }}'
    ansible_connection: local

- name: Gather vSphere schema information
  community.vmware.vmware_datacenter_info:
    <<: *esxi_login
    schema: vsphere
    properties:
    - configStatus
    - overallStatus
  delegate_to: '{{ vcenter_address }}'
  register: datacenter_info

- name: Check VMWare datacenter status
  fail: msg="Vmware datacenter is not Green"
  when: "datacenter_info['datacenter_info'] is not defined or datacenter_info['datacenter_info'][0]['overallStatus'] is not defined or datacenter_info['datacenter_info'][0]['overallStatus'] != 'green'"

- name: Gather datastore information
  community.vmware.vmware_datastore_info:
    <<: *esxi_login
    schema: vsphere
    properties:
    - name
    - overallStatus
  delegate_to: '{{ vcenter_address }}'
  register: datastore_info

- name: Filter temp datastore
  set_fact:
    temp_datastore: "{{ datastore_info.datastores | json_query(jmesquery) | first }}"
  vars:
    jmesquery: "[? overallStatus==`green` && name==`datastore1`].name"

- name: Filter selected datastore
  set_fact:
    selected_datastore: "{{ datastore_info.datastores | json_query(jmesquery) | first }}"
  vars:
    jmesquery: "[? overallStatus==`green` && name==`{{ vcenter_datastore }}`].name"

- name: Check temp datastore status
  fail: msg="Vmware datastore {{ temp_datastore }} not exists or is not green"
  when: "temp_datastore is not defined or temp_datastore|length == 0"

- name: Check selected datastore status
  fail: msg="Vmware datastore {{ selected_datastore }} not exists or is not green"
  when: "selected_datastore is not defined or selected_datastore|length == 0"

- name: Create ISO directory at datastore {{ selected_datastore }}
  community.vmware.vsphere_file:
    <<: *esxi_login
    datastore: '{{ temp_datastore }}'
    path: ISO
    state: directory
  delegate_to: '{{ vcenter_address }}'

- name: Copy server2016eval.flp file to {{ temp_datastore }}/ISO folder
  community.vmware.vsphere_copy:
    <<: *esxi_login
    datastore: '{{ temp_datastore }}'
    src: server2016eval.flp
    path: ISO/server2016eval.flp
  delegate_to: '{{ vcenter_address }}'

- name: Check uploaded file
  community.vmware.vsphere_file:
    <<: *esxi_login
    datastore: '{{ temp_datastore }}'
    path: ISO/server2016eval.flp
    state: file
  delegate_to: '{{ vcenter_address }}'

- name: Set file path
  set_fact:
    file_path: 'ISO/{{ windows_iso }}'

- name: Check if windows ISO is already exists
  community.vmware.vsphere_file:
    <<: *esxi_login
    datastore: '{{ temp_datastore }}'
    path: '{{ file_path }}'
    state: file
  delegate_to: '{{ vcenter_address }}'
  ignore_errors: true
  register: iso_info

- name: Check if ISO file is already exists
  set_fact:
    iso_exists: "{{ file_path in ([ iso_info ] | json_query(jmesquery) |\
    map(attribute='Path') | list ) }}"
  vars:
    jmesquery: "[? path==`{{ file_path }}` && status==`200`].{Path: path, Status: status, Size: size}"

- name: Download ISO
  ansible.builtin.get_url:
    url: '{{ windows_iso_url }}'
    dest: './{{ windows_iso }}'
  delegate_to: '{{ vcenter_address }}'
  when: not iso_exists

- name: Copy ISO file to {{ temp_datastore }}/ISO folder
  community.vmware.vsphere_copy:
    <<: *esxi_login
    datastore: '{{ temp_datastore }}'
    src: '{{ windows_iso }}'
    path: 'ISO/{{ windows_iso }}'
  delegate_to: '{{ vcenter_address }}'
  when: not iso_exists

- name: Check uploaded ISO file
  community.vmware.vsphere_file:
    <<: *esxi_login
    datastore: '{{ temp_datastore }}'
    path: '{{ file_path }}'
    state: file
  delegate_to: '{{ vcenter_address }}'

- name: Create a new Windows Server VM
  vmware_guest:
    <<: *esxi_login
    folder: /
    name: '{{ vm_name }}'
    # O nome da VM costuma ser gerado (vm-<id>); a descrição guarda o nome
    # legível de quem pediu o deploy.
    annotation: "{{ vm_annotation | default('') }}"
    state: present
    # windows9Server64Guest = Server 2016/2019. Windows 10/11 usam
    # windows9_64Guest (ESXi 7) ou windows11_64Guest (ESXi 8+).
    guest_id: "{{ vm_guest_id | default('windows9Server64Guest') }}"
    cdrom:
      - controller_number: 0
        unit_number: 0
        state: present
        type: iso
        iso_path: '[{{ temp_datastore }}] {{ file_path }}'
    disk:
    - size_gb: '{{ vm_disk_gb }}'
      type: thin
      datastore: '{{ selected_datastore }}'
    hardware:
      memory_mb: '{{ vm_memory_mb }}'
      num_cpus: '{{ vm_num_cpus }}'
      scsi: "{{ vm_scsi_type | default('lsilogicsas') }}"
    networks:
    - name: '{{ vm_network }}'
      device_type: e1000
    wait_for_ip_address: no
  delegate_to: '{{ vcenter_address }}'
  register: deploy_vm

#  - debug: msg="{{deploy_vm}}"

# Power off the VM


- name: Change virtual machine's boot order and related parameters
  vmware_guest_boot_manager:
    hostname: '{{ vcenter_address }}'
    username: '{{ vcenter_login }}'
    password: '{{ vcenter_password }}'  
    validate_certs: no  
    name: '{{ vm_name }}'
    boot_delay: 1000
    enter_bios_setup: False
    boot_retry_enabled: True
    boot_retry_delay: 20000
    boot_firmware: bios
    secure_boot_enabled: False
    boot_order:
      - cdrom
      - disk
      - ethernet
      - floppy
  delegate_to: '{{ vcenter_address }}'
  register: vm_boot_order

- name: Attach Floppy to VM
  helviojunior.vmware.vmware_guest_floppy:
    <<: *esxi_login
    name: '{{ vm_name }}'
    #state: absent
    #type: none
    type: flp
    image_file: '[{{ temp_datastore }}] ISO/server2016eval.flp'
    start_connected: true
  delegate_to: '{{ vcenter_address }}'
  register: deploy_vm

- name: Power-On the virtual machine
  vmware.vmware.vm_powerstate:
    <<: *esxi_login
    name: '{{ vm_name }}'
    state: powered-on
  delegate_to: '{{ vcenter_address }}'
  register: powerstate

# O VMware Tools e instalado pelo script.cmd do floppy, que roda no primeiro
# logon (FirstLogonCommands). Se o AutoLogon nao acontecer -- ex.: o Windows 11
# com rede aplica atualizacoes no OOBE e reinicia antes do primeiro logon -- a
# VM fica parada na tela de login e o Tools nunca aparece. O rescue faz o que um
# operador faria pela console: acorda a tela, levanta a cortina de bloqueio,
# digita a senha e da ENTER. O FirstLogonCommands roda em qualquer primeiro
# logon, nao so no automatico.
- name: Wait for VMware tools (console login fallback)
  block:
    - name: Wait for VMware tools to become available
      vmware_guest_tools_wait:
        <<: *esxi_login
        name: '{{ vm_name }}'
      delegate_to: '{{ vcenter_address }}'
      retries: 3
      delay: 15
      register: result
      until: result is succeeded

  rescue:
    - name: Console login | VMware Tools did not come up, AutoLogon probably did not happen
      debug:
        msg: >-
          VMware Tools nao respondeu; entrando como Administrator pela console
          da VM para disparar o FirstLogonCommands.

    # ESC e seguro em qualquer ponto da tela de login: o 1o acorda o monitor
    # apagado, o 2o levanta a cortina de bloqueio e, no campo de senha, ESC so
    # limpa o que estiver digitado.
    - name: Console login | Wake the screen and lift the lock screen
      community.vmware.vmware_guest_sendkey:
        <<: *esxi_login
        name: '{{ vm_name }}'
        keys_send: [ESC, ESC, ESC]
        sleep_time: 4
      delegate_to: '{{ vcenter_address }}'

    - name: Console login | Type the Administrator password
      community.vmware.vmware_guest_sendkey:
        <<: *esxi_login
        name: '{{ vm_name }}'
        string_send: '{{ default_password }}'
      delegate_to: '{{ vcenter_address }}'
      no_log: true

    - name: Console login | Submit
      community.vmware.vmware_guest_sendkey:
        <<: *esxi_login
        name: '{{ vm_name }}'
        keys_send: [ENTER]
      delegate_to: '{{ vcenter_address }}'

    - name: Wait for VMware tools after the console login
      vmware_guest_tools_wait:
        <<: *esxi_login
        name: '{{ vm_name }}'
      delegate_to: '{{ vcenter_address }}'
      retries: 3
      delay: 15
      register: result
      until: result is succeeded

- name: Detach CDROM
  vmware_guest:
    <<: *esxi_login
    folder: /
    name: '{{ vm_name }}'
    state: present
    cdrom:
      - controller_number: 0
        unit_number: 0
        state: present
        type: none
  delegate_to: '{{ vcenter_address }}'
  register: deploy_vm

- name: Detach Floppy
  helviojunior.vmware.vmware_guest_floppy:
    <<: *esxi_login
    name: '{{ vm_name }}'
    state: present
    type: none
  delegate_to: '{{ vcenter_address }}'
  register: deploy_vm

- name: Creating a script to enable Remote Desktop
  copy:
    dest: '{{ tmp_file }}'
    content: |
      $NewPassword = "{{ vm_password_new }}"
      $SecPassword = ConvertTo-SecureString $NewPassword -AsPlainText -Force
      $UserAccount = Get-LocalUser -Name "Administrator"
      $UserAccount | Set-LocalUser -Password $SecPassword
  delegate_to: localhost

- name: Check if the password has already been changed
  vmware_vm_shell:
    <<: *esxi_login
    vm_username: Administrator
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    vm_shell_cwd: 'c:\windows\temp\'
    vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
    vm_shell_args: '-Command Get-Host'
    wait_for_process: true
    # Sem isto o módulo espera o padrão dele (3600s): um processo
    # travado no guest seguraria o deploy por uma hora.
    timeout: 300
  delegate_to: localhost
  ignore_errors: true
  register: check_pass

- name: Send a script to change password
  vmware_guest_file_operation:
    <<: *esxi_login
    vm_username: Administrator
    # Senha inicial do unattended: a do floppy gerado agora ou a lida da
    # imagem de fábrica (tasks/floppy.yml define unattend_admin_password).
    vm_password: "{{ unattend_admin_password | default('@Pass123456') }}"
    vm_id: '{{ vm_name }}'
    copy:
      src: '{{ tmp_file }}'
      dest: 'c:\windows\temp\exec.txt'
      overwrite: True
  delegate_to: localhost
  when: "check_pass is defined and not check_pass.changed"

#As we are changing the password the ansible show an error of authentication failure
# so, we need to ignore the error
# 1 - In the previous step we already validated actual password
# 2 - In the next step we will validate the new password
- name: Change password
  vmware_vm_shell:
    <<: *esxi_login
    vm_username: Administrator
    # Senha inicial do unattended: a do floppy gerado agora ou a lida da
    # imagem de fábrica (tasks/floppy.yml define unattend_admin_password).
    vm_password: "{{ unattend_admin_password | default('@Pass123456') }}"
    vm_id: '{{ vm_name }}'
    vm_shell_cwd: 'c:\windows\temp\'
    vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
    vm_shell_args: '-enc JABGAGkAbABlAEQAYQB0AGEAIAA9ACAARwBlAHQALQBDAG8AbgB0AGUAbgB0ACAAZQB4AGUAYwAuAHQAeAB0AAoAJABGAGkAbABlAEQAYQB0AGEAIAB8ACAASQBuAHYAbwBrAGUALQBFAHgAcAByAGUAcwBzAGkAbwBuAA=='
    wait_for_process: true
    # Sem isto o módulo espera o padrão dele (3600s): um processo
    # travado no guest seguraria o deploy por uma hora.
    timeout: 300
  delegate_to: localhost
  ignore_errors: true
  when: "check_pass is defined and not check_pass.changed"

- name: Check password
  vmware_vm_shell:
    <<: *esxi_login
    vm_username: Administrator
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    vm_shell_cwd: 'c:\windows\temp\'
    vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
    vm_shell_args: '-Command Get-Host'
    wait_for_process: true
    # Sem isto o módulo espera o padrão dele (3600s): um processo
    # travado no guest seguraria o deploy por uma hora.
    timeout: 300
  delegate_to: localhost
  ignore_errors: false
  when: "check_pass is defined and not check_pass.changed"

- name: Rename Computer via vmware_vm_shell
  # Nome de computador do Windows: 15 caracteres, sem espaço nem pontuação — o
  # nome da VM no vCenter não serve. `vm_hostname` vem do orquestrador
  # (vm<13 hex>); fora dele, sanitiza e corta o nome da VM.
  vars:
    computer_name: "{{ (vm_hostname | default('') | trim) | default(vm_name | regex_replace('[^A-Za-z0-9-]', '-') | truncate(15, true, ''), true) }}"
  vmware_vm_shell:
    <<: *esxi_login
    vm_username: Administrator
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
    vm_shell_args: '-command "(Rename-Computer -NewName {{ computer_name }} -Force)"'
    wait_for_process: true
    # Sem isto o módulo espera o padrão dele (3600s): um processo
    # travado no guest seguraria o deploy por uma hora.
    timeout: 300
  delegate_to: localhost

- name: Creating a script to enable Remote Desktop
  copy:
    dest: '{{ tmp_file }}'
    content: |
      New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\terminal server" -Name fDenyTSConnections -Value 0 -ErrorAction SilentlyContinue | Out-Null
      Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\terminal server" -Name fDenyTSConnections -Value 0
      Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp\" -Name "UserAuthentication" -Value 1
      Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
  delegate_to: localhost

- name: Send a script to enable Remote Desktop
  vmware_guest_file_operation:
    <<: *esxi_login
    vm_username: Administrator
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    copy:
      src: '{{ tmp_file }}'
      dest: 'c:\windows\temp\exec.txt'
      overwrite: True
  delegate_to: localhost

- name: Enable Remote Desktop
  vmware_vm_shell:
    <<: *esxi_login
    vm_username: Administrator
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    vm_shell_cwd: 'c:\windows\temp\'
    vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
    vm_shell_args: '-enc JABGAGkAbABlAEQAYQB0AGEAIAA9ACAARwBlAHQALQBDAG8AbgB0AGUAbgB0ACAAZQB4AGUAYwAuAHQAeAB0AAoAJABGAGkAbABlAEQAYQB0AGEAIAB8ACAASQBuAHYAbwBrAGUALQBFAHgAcAByAGUAcwBzAGkAbwBuAA=='
    wait_for_process: true
    # Sem isto o módulo espera o padrão dele (3600s): um processo
    # travado no guest seguraria o deploy por uma hora.
    timeout: 300
  delegate_to: localhost
  ignore_errors: true

- name: Delete script local copy
  file:
    state: absent
    path: '{{ tmp_file }}'
  delegate_to: localhost

# O WinRM e ligado pelo script.cmd do floppy, mas a imagem de fabrica
# (resources/server2016eval.flp) e antiga e, no Windows 10/11, a rede entra
# como Public e o Enable-PSRemoting aborta sem criar o listener HTTPS. Garante
# o listener aqui, pelo VMware Tools, antes do Ansible precisar da 5986. O
# script e idempotente: onde o listener ja existe ele so confere.
- name: Send ConfigureRemotingForAnsible.ps1
  vmware_guest_file_operation:
    <<: *esxi_login
    vm_username: Administrator
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    copy:
      src: 'resources/ConfigureRemotingForAnsible.ps1'
      dest: 'c:\windows\temp\ConfigureRemotingForAnsible.ps1'
      overwrite: True
  delegate_to: localhost

- name: Ensure WinRM HTTPS listener
  vmware_vm_shell:
    <<: *esxi_login
    vm_username: Administrator
    vm_password: '{{ vm_password_new }}'
    vm_id: '{{ vm_name }}'
    vm_shell_cwd: 'c:\windows\temp\'
    vm_shell: 'c:\windows\system32\windowspowershell\v1.0\powershell.exe'
    vm_shell_args: >-
      -ExecutionPolicy Bypass -Command "Get-NetConnectionProfile -ErrorAction Ignore | Set-NetConnectionProfile -NetworkCategory Private -ErrorAction Ignore;
      Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction Ignore;
      & c:\windows\temp\ConfigureRemotingForAnsible.ps1 -SkipNetworkProfileCheck"
    wait_for_process: true
    timeout: 300
  delegate_to: localhost

- name: Reboot-Guest
  vmware.vmware.vm_powerstate:
    <<: *esxi_login 
    name: '{{ vm_name }}'
    state: reboot-guest
  delegate_to: localhost
  register: deploy

- name: Wait for 30 seconds
  wait_for: timeout=30
  delegate_to: localhost

- name: Wait for VMware tools to become available by name
  vmware_guest_tools_wait:
    <<: *esxi_login
    name: '{{ vm_name }}'
  delegate_to: '{{ vcenter_address }}'
  retries: 3
  delay: 15
  register: result           
  until: result is succeeded 

- name: Wait for 30 seconds for VMware Tools refresh
  wait_for: timeout=30
  delegate_to: localhost

- name: Find the VM's IP Address via VMware tools
  vmware_guest_info:
    <<: *esxi_login
    name: '{{ vm_name }}'
  delegate_to: '{{ vcenter_address }}'
  register: vmfacts
  retries: 30
  delay: 15
  until: vmfacts['instance'] is defined and vmfacts['instance']['ipv4'] is defined and vmfacts['instance']['ipv4'] != ''

- name: Get IP
  set_fact:
    windows_ip: "{{ vmfacts['instance']['ipv4'] }}"

- debug: msg="IP Address - {{ windows_ip }}"

# No Windows 10/11 o servico WinRM e "Automatic (Delayed Start)": sobe uns
# 2 minutos depois do boot, bem depois do VMware Tools. Sem esperar, o
# Gathering Facts do play new_windows toma "connection refused" na 5986.
- name: Wait for WinRM (5986)
  wait_for:
    host: '{{ windows_ip }}'
    port: 5986
    timeout: 600
  delegate_to: localhost

- name: "Set new windows inventory host group"
  set_fact:
    host_group: 'new_windows'
  when: host_group is not defined or host_group == ''

- name: Add new VM Windows to Ansible Hosts
  add_host:
    name: '{{ windows_ip }}'
    group: '{{ host_group }}'
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_user: 'Administrator'
    ansible_password: '{{ vm_password_new }}'

- name: Create local directory 'output'
  ansible.builtin.file:
    path: output
    state: directory
  delegate_to: localhost

- name: Save host IP
  copy:
    dest: "output/{{ vm_name }}_ip.txt"
    content: "{{ windows_ip }}"
  delegate_to: localhost

