---
# Create floppy disk
# Source: https://madlabber.wordpress.com/2019/06/19/using-autounattend-xml-to-enable-ansible-support-in-windows/
# 
- name: Floppy | Create local directory 'unattend'
  ansible.builtin.file:
    path: unattend
    state: directory
  register: local_dir
  delegate_to: localhost

- name: Floppy | Creating a step1.ps1 file
  copy:
    dest: "unattend/step1.ps1"
    content: |
      $userAccount = Get-LocalUser -Name "Administrator" -ErrorAction Ignore
      $secPassword = ConvertTo-SecureString "@Pass123456" -AsPlainText -Force -ErrorAction Ignore
      $userAccount | Set-LocalUser -Password $secPassword -ErrorAction Ignore
  delegate_to: localhost

- name: Floppy | Creating a step2.ps1 file
  copy:
    dest: "unattend/step2.ps1"
    content: |
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest -Uri https://packages.vmware.com/tools/esx/7.0u3/windows/x64/VMware-tools-11.3.0-18090558-x86_64.exe -OutFile C:\Windows\temp\VMware-tools.exe
  delegate_to: localhost

- name: Floppy | Creating a step3.ps1 file
  copy:
    dest: "unattend/step3.ps1"
    content: |
      Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction Ignore
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-Expression ((New-Object System.Net.Webclient).DownloadString('https://raw.githubusercontent.com/helviojunior/ansible-vmware-windows/main/resources/ConfigureRemotingForAnsible.ps1'))
  delegate_to: localhost

- name: Floppy | Creating a script.cmd file
  copy:
    dest: "unattend/script.cmd"
    content: |
      @echo off
      a:
      cd a:\
      powershell -ExecutionPolicy ByPass -File a:\step1.ps1
      powershell -ExecutionPolicy ByPass -File a:\step2.ps1
      powershell -ExecutionPolicy ByPass -File a:\step3.ps1
      C:\Windows\temp\VMware-tools.exe /S /v"/qn REBOOT=R"
  delegate_to: localhost

- name: Floppy | Creating a autounattend.xml file
  copy:
    dest: "unattend/autounattend.xml"
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <!--*************************************************
      Windows Answer File
      Baseado no gerador do http://www.windowsafg.com

      A declaracao <?xml?> tem que ser a PRIMEIRA linha do arquivo; qualquer
      comentario antes dela deixa o XML invalido.

      Notas de instalacao

      Modificado para funcionar com a ISO EVAL de 180 dias:
      -Adicionado <InstallFrom>...</InstallFrom>
      -Removido o <ProductKey> fixo (agora vem de windows_product_key)

      Modificado para habilitar o WinRM para o Ansible
      -Adicionado <logoncount>1</logoncount>
      -Adicionado <FirstLogonCommands>...</FirstLogonCommands>

      Modificado para Windows 10/11 de midia retail (consumer editions):
      -<ProductKey> passou a ser obrigatorio: sem ele o setup para em
       "Windows cannot read the <ProductKey> setting from the unattend answer file",
       porque a ISO tem varias edicoes e a chave e o que diz qual instalar.
      -LabConfig no pass windowsPE: ignora as exigencias de TPM/Secure Boot/RAM/
       disco/CPU do Windows 11 numa VM legada.
      -O Administrator interno vem DESABILITADO nas edicoes cliente: o specialize
       o habilita (net user), senao o AutoLogon falha, a VM para na tela de
       bloqueio e o script.cmd (WinRM/VMware Tools) nunca roda. Saiu o
       <LocalAccount> "Administrator", que colidia com a conta interna.
      **************************************************-->
      {% set _pkey = (windows_product_key | default('')) | trim %}
      {% set _inam = (windows_image_name | default('')) | trim %}
      {# Indice 2 so e o padrao sem chave E sem nome: antes ele valia mesmo com
         windows_image_name definido e, testado primeiro, ignorava o nome. #}
      {% set _iidx = (windows_image_index | default('2' if (_pkey | length == 0 and _inam | length == 0) else '')) | string | trim %}
      <unattend xmlns="urn:schemas-microsoft-com:unattend">
      <settings pass="windowsPE">
      <component name="Microsoft-Windows-International-Core-WinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <SetupUILanguage>
      <UILanguage>en-US</UILanguage>
      </SetupUILanguage>
      <InputLocale>0c09:00000409</InputLocale>
      <SystemLocale>en-US</SystemLocale>
      <UILanguage>en-US</UILanguage>
      <UILanguageFallback>en-US</UILanguageFallback>
      <UserLocale>en-US</UserLocale>
      </component>
      <component name="Microsoft-Windows-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <ImageInstall>
      <OSImage>
      <InstallTo>
      <DiskID>0</DiskID>
      <PartitionID>2</PartitionID>
      </InstallTo>
      {% if _iidx | length > 0 %}
          <InstallFrom>
          <MetaData wcm:action="add">
                <Key>/IMAGE/INDEX</Key>
                <Value>{{ _iidx }}</Value>
            </MetaData>
          </InstallFrom>
      {% elif _inam | length > 0 %}
          <InstallFrom>
          <MetaData wcm:action="add">
                <Key>/IMAGE/NAME</Key>
                <Value>{{ _inam }}</Value>
            </MetaData>
          </InstallFrom>
      {% endif %}
      </OSImage>
      </ImageInstall>
      <UserData>
      {% if _pkey | length > 0 %}
      <ProductKey>
      <Key>{{ _pkey }}</Key>
      <WillShowUI>OnError</WillShowUI>
      </ProductKey>
      {% endif %}
      <AcceptEula>true</AcceptEula>
      <FullName>Administrator</FullName>
      <Organization>Organization</Organization>
      </UserData>
      <EnableFirewall>true</EnableFirewall>
      <DiskConfiguration>
      <Disk wcm:action="add">
      <CreatePartitions>
      <CreatePartition wcm:action="add">
      <Order>1</Order>
      <Size>350</Size>
      <Type>Primary</Type>
      </CreatePartition>
      <CreatePartition wcm:action="add">
      <Extend>true</Extend>
      <Order>2</Order>
      <Type>Primary</Type>
      </CreatePartition>
      </CreatePartitions>
      <ModifyPartitions>
      <ModifyPartition wcm:action="add">
      <Format>NTFS</Format>
      <Label>System</Label>
      <Order>1</Order>
      <PartitionID>1</PartitionID>
      <TypeID>0x27</TypeID>
      </ModifyPartition>
      <ModifyPartition wcm:action="add">
      <Order>2</Order>
      <PartitionID>2</PartitionID>
      <Letter>C</Letter>
      <Label>System</Label>
      <Format>NTFS</Format>
      </ModifyPartition>
      </ModifyPartitions>
      <DiskID>0</DiskID>
      <WillWipeDisk>true</WillWipeDisk>
      </Disk>
      </DiskConfiguration>
      {% if windows_bypass_requirements | default(true) | bool %}
      <RunSynchronous>
      <RunSynchronousCommand wcm:action="add">
      <Order>1</Order>
      <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassTPMCheck /t REG_DWORD /d 1 /f</Path>
      </RunSynchronousCommand>
      <RunSynchronousCommand wcm:action="add">
      <Order>2</Order>
      <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassSecureBootCheck /t REG_DWORD /d 1 /f</Path>
      </RunSynchronousCommand>
      <RunSynchronousCommand wcm:action="add">
      <Order>3</Order>
      <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassRAMCheck /t REG_DWORD /d 1 /f</Path>
      </RunSynchronousCommand>
      <RunSynchronousCommand wcm:action="add">
      <Order>4</Order>
      <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassStorageCheck /t REG_DWORD /d 1 /f</Path>
      </RunSynchronousCommand>
      <RunSynchronousCommand wcm:action="add">
      <Order>5</Order>
      <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassCPUCheck /t REG_DWORD /d 1 /f</Path>
      </RunSynchronousCommand>
      </RunSynchronous>
      {% endif %}
      </component>
      </settings>
      <settings pass="offlineServicing">
      <component name="Microsoft-Windows-LUA-Settings" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <EnableLUA>false</EnableLUA>
      </component>
      </settings>
      <settings pass="generalize">
      <component name="Microsoft-Windows-Security-SPP" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <SkipRearm>1</SkipRearm>
      </component>
      </settings>
      <settings pass="specialize">
      <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <InputLocale>0409:00000409</InputLocale>
      <SystemLocale>en-US</SystemLocale>
      <UILanguage>en-US</UILanguage>
      <UILanguageFallback>en-US</UILanguageFallback>
      <UserLocale>en-US</UserLocale>
      </component>
      <component name="Microsoft-Windows-Security-SPP-UX" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <SkipAutoActivation>true</SkipAutoActivation>
      </component>
      <component name="Microsoft-Windows-SQMApi" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <CEIPEnabled>0</CEIPEnabled>
      </component>
      <component name="Microsoft-Windows-Deployment" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <RunSynchronous>
      <RunSynchronousCommand wcm:action="add">
      <Order>1</Order>
      <Description>Enable the built-in Administrator (disabled on Windows 10/11 client editions)</Description>
      <Path>cmd /c net user Administrator /active:yes</Path>
      </RunSynchronousCommand>
      {% if windows_bypass_requirements | default(true) | bool %}
      <RunSynchronousCommand wcm:action="add">
      <Order>2</Order>
      <Description>Bypass OOBE network requirement</Description>
      <Path>reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OOBE /v BypassNRO /t REG_DWORD /d 1 /f</Path>
      </RunSynchronousCommand>
      {% endif %}
      </RunSynchronous>
      </component>
      <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <ComputerName></ComputerName>
      </component>
      </settings>
      <settings pass="oobeSystem">
      <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <AutoLogon>
        <Password>
          <Value>{{ default_password }}</Value>
          <PlainText>true</PlainText>
        </Password>
        <Enabled>true</Enabled>
        <Username>Administrator</Username>
          <LogonCount>1</LogonCount>
      </AutoLogon>
      <FirstLogonCommands>
          <SynchronousCommand wcm:action="add">
            <Order>1</Order>
            <CommandLine>a:\script.cmd</CommandLine>
          </SynchronousCommand>
      </FirstLogonCommands>  
      <OOBE>
      <HideEULAPage>true</HideEULAPage>
      <HideLocalAccountScreen>true</HideLocalAccountScreen>
      <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
      <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
      <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
      <NetworkLocation>Work</NetworkLocation>
      <ProtectYourPC>3</ProtectYourPC>
      <SkipMachineOOBE>true</SkipMachineOOBE>
      <SkipUserOOBE>true</SkipUserOOBE>
      </OOBE>
      <UserAccounts>
      <AdministratorPassword>
      <Value>{{ default_password }}</Value>
      <PlainText>true</PlainText>
      </AdministratorPassword>
      </UserAccounts>
      <RegisteredOrganization>Organization</RegisteredOrganization>
      <RegisteredOwner>Administrator</RegisteredOwner>
      <DisableAutoDaylightTimeSet>false</DisableAutoDaylightTimeSet>
      <TimeZone>Pacific Standard Time</TimeZone>
      </component>
      </settings>
      </unattend>
  delegate_to: localhost

- name: Floppy | Removing old release
  shell: |
    rm -rf floppy.dmg server2016eval.flp
  delegate_to: localhost
  ignore_errors: yes

# A imagem pode ser gerada de dois jeitos, conforme o controller: hdiutil
# (macOS) ou dosfstools + mtools (Linux). O caminho Linux importa porque o
# playbook normalmente roda de dentro de um container.
- name: Floppy | Look for the image tooling
  shell: |
    echo "hdiutil=$(command -v hdiutil || true)"
    echo "mkfs=$(command -v mkfs.msdos || command -v mkfs.vfat || true)"
    echo "mcopy=$(command -v mcopy || true)"
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: false
  register: floppy_tools

- name: Floppy | Available tooling
  set_fact:
    floppy_has_hdiutil: "{{ 'hdiutil=/' in floppy_tools.stdout }}"
    floppy_has_mcopy: "{{ 'mcopy=/' in floppy_tools.stdout }}"
    floppy_mkfs: "{{ (floppy_tools.stdout_lines | select('match', '^mkfs=/') | list | first | default('mkfs='))[5:] }}"

- name: Floppy | Generating floppy image (macOS, hdiutil)
  shell: |
    set -e
    hdiutil create -size 1440k -fs "MS-DOS FAT12" -layout NONE -srcfolder unattend -format UDRW -ov floppy.dmg
    cp floppy.dmg server2016eval.flp
  args:
    executable: /bin/bash
  delegate_to: localhost
  retries: 5
  delay: 10
  until: "new_image is not failed"
  ignore_errors: yes
  register: new_image
  when: floppy_has_hdiutil | bool

# 1.44 MB, FAT12, arquivos copiados com o mtools: sem root e sem loop device —
# é o que faz isto funcionar dentro de um container.
- name: Floppy | Generating floppy image (Linux, dosfstools + mtools)
  shell: |
    set -e
    rm -f server2016eval.flp
    dd if=/dev/zero of=server2016eval.flp bs=1024 count=1440 status=none
    "{{ floppy_mkfs }}" -F 12 -n UNATTEND server2016eval.flp >/dev/null
    mcopy -i server2016eval.flp -s -o unattend/* ::
    mdir -i server2016eval.flp ::
  args:
    executable: /bin/bash
  delegate_to: localhost
  retries: 3
  delay: 5
  until: "new_image is not failed"
  ignore_errors: yes
  register: new_image
  when:
    - not (floppy_has_hdiutil | bool)
    - floppy_mkfs | length > 0
    - floppy_has_mcopy | bool

- name: Floppy | Image generated
  set_fact:
    floppy_generated: "{{ (new_image is defined) and ((new_image.rc | default(1)) == 0) }}"

# Sem ferramenta nenhuma: usa a imagem versionada no repositório. Ela sobe uma
# VM funcional, mas com o autounattend de fábrica — sem as personalizações
# desta execução.
- name: Floppy | Copy standard image to floppy.flp (fallback)
  copy:
    src: resources/server2016eval.flp
    dest: server2016eval.flp
  delegate_to: localhost
  when: not (floppy_generated | bool)

# A imagem de fábrica traz a própria senha inicial embutida: em vez de assumir
# qual é, lê da imagem — é com ela que o deploy.yml entra na VM depois.
- name: Floppy | Read the password embedded in the standard image
  shell: |
    set -o pipefail
    # As duas leituras abaixo varrem a imagem FAT byte a byte; sem LC_ALL=C o
    # tr do BSD (macOS) aborta com "Illegal byte sequence" no primeiro byte
    # invalido em UTF-8 e a senha volta vazia.
    export LC_ALL=C
    img=resources/server2016eval.flp
    pass=""
    if command -v mcopy >/dev/null 2>&1; then
      pass=$(mcopy -i "$img" ::/step1.ps1 - 2>/dev/null | tr -d '\r' \
             | grep -o 'ConvertTo-SecureString "[^"]*"' | head -1 | cut -d'"' -f2)
    fi
    # Sem mtools, o .ps1 e o XML estão em texto puro dentro da imagem FAT.
    if [ -z "$pass" ]; then
      pass=$(tr -d '\r' < "$img" | grep -a -o 'ConvertTo-SecureString "[^"]*"' \
             | head -1 | cut -d'"' -f2)
    fi
    if [ -z "$pass" ]; then
      pass=$(tr -d '\r\n' < "$img" | grep -a -o '<AdministratorPassword>.\{0,200\}' \
             | grep -a -o '<Value>[^<]*</Value>' | head -1 \
             | sed 's|<Value>||; s|</Value>||')
    fi
    printf '%s' "$pass"
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: false
  failed_when: false
  register: stock_floppy_password
  when: not (floppy_generated | bool)

- name: Floppy | Warn about the fallback image
  debug:
    msg: >-
      Sem ferramenta para gerar o floppy (hdiutil no macOS; dosfstools + mtools
      no Linux): a VM vai subir com o autounattend de fábrica desta imagem, sem
      as personalizações deste deploy. Senha inicial lida da imagem:
      "{{ stock_floppy_password.stdout | default('') | trim | default('@Pass123456', true) }}".
  when: not (floppy_generated | bool)

# Senha com que o deploy.yml entra na VM logo depois da instalação: a do floppy
# gerado agora (step1.ps1) ou a lida da imagem de fábrica.
- name: Floppy | Initial administrator password
  set_fact:
    unattend_admin_password: "{{ stock_floppy_password.stdout | default('') | trim | default('@Pass123456', true) }}"

- name: Floppy | Delete local directory 'unattend'
  file:
    state: absent
    path: unattend
  delegate_to: localhost

- name: Floppy | Delete floppy.dmg
  file:
    state: absent
    path: floppy.dmg
  delegate_to: localhost

